# Single config that drives the whole gnnid pipeline.
# Override any key on the CLI: gnnid train --set train.lr=5e-4

seed: 17

detector: flash                 # flash | ppt — which Detector implementation runs

data:
  runs_glob: "ubench/results/*/"
  benchmarks: [boutique]        # per-benchmark model in v1
  parquet_dir: "data/parquet"
  sentences_dir: "data/sentences"
  val_frac: 0.2                 # temporal split BY RUN (never random)
  test_frac: 0.2

windows:
  width_s: 30
  stride_s: 15
  min_tail_s: 15                # keep a trailing partial window if >= this

events:
  # L4 flow selection: Hubble emits many observations per connection; keep
  # only informative ones (rule of the prior approved plan).
  l4_keep: [non_forwarded, syn_no_ack, udp_first]
  drop_control_plane_audit: true   # audit events not attributable to a pod

sentences:
  max_tokens: 256
  max_repeats_per_signature: 3  # FLASH-style identical-event dedup (first/mid/last)
  neighbor_identity: none       # none | service (ablation only; none avoids 2-hop label leakage)
  strip_verdict_tokens: false   # eval flips this to test weak-signal honesty

w2v:
  dim: 64
  sg: 1                         # skip-gram, better on small corpora
  window: 5
  negative: 10
  min_count: 2
  epochs: 15
  workers: 4

graph:
  include_workload_nodes: false
  reverse_edges: true
  dedup_key: [src, dst, event_type]

model:
  objective: flash_cls          # flash_cls | masked_recon (future config swap)
  hidden: 128
  embed: 64
  dropout: 0.25
  conv: sage

train:
  lr: 1.0e-3
  weight_decay: 5.0e-4
  max_epochs: 200
  patience: 20
  batch_windows: 8
  xgb:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.1
    early_stopping_rounds: 20

scoring:
  source: xgb                   # xgb | gnn | w2v (ablation switch)
  score: one_minus_p_true
  threshold_q: 0.995            # benign-val quantile per node type
  agg: [max, top3_mean]         # per-pod aggregation across windows

artifacts_dir: "artifacts/default"
results_dir: "results_eval"     # scores/alerts/eval-report output dir

# Per-detector overlays, deep-merged over the base sections by
# config.detector_view (dicts merge recursively; scalars and lists replace —
# a detector overriding a section like `windows` should restate every key it
# depends on). The base sections above ARE the flash defaults. Detector-scoped
# CLI overrides go under this prefix: --set detectors.ppt.windows.width_s=10
detectors:
  flash: {}
  ppt:
    artifacts_dir: "artifacts/ppt"
    results_dir: "results_eval/ppt"
    windows: {width_s: 5, stride_s: 5, min_tail_s: 2.5, memory: 5}  # non-overlapping snapshots + window memory (paper: 5s, N=5)
    graph:
      flow_memory: 20             # max previous same-src/same-dst temporal edges per event
      max_events_per_window: 1000 # CPU guard; non-FORWARDED L4 events always kept
    features:
      time_enc_dim: 16            # sinusoidal order-in-window / window-age encoding
      path_vocab: 64              # top-K templated RPC paths (OOV -> index 0)
      dns_vocab: 32               # top-K external eTLD+1
      api_resource_vocab: 32      # top-K k8s resources
    model: {objective: ppt_cls, hidden: 128, layers: 2, dropout: 0.2}
    train:
      pretrain:                   # stage 1: self-supervised link prediction
        enabled: true
        lr: 1.0e-4
        epochs: 40
        patience: 8
        neg_ratio: 1.0            # negatives per positive supervision edge
        holdout_frac: 0.3         # supervision split (rest are message edges)
        max_pos_per_type: 2000
        batch_graphs: 4
      finetune:                   # stage 2: role classification
        lr: 1.0e-2
        weight_decay: 5.0e-4
        max_epochs: 100
        patience: 15
        batch_graphs: 4
      scratch_lr: 1.0e-3          # finetune lr when pretrain.enabled=false
