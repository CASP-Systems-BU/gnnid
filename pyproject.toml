[project]
name = "gnnid"
version = "0.1.0"
description = "FLASH-style GNN intrusion detection for Kubernetes telemetry (ubench runs)"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "torch-geometric>=2.6",
    "gensim>=4.3.3",
    "xgboost>=2.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "pyyaml>=6",
    # gensim 4.3.x is not numpy-2 clean; keep the 1.x line.
    "numpy>=1.26,<2",
    "scipy<1.14",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
gnnid = "gnnid.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gnnid"]

# CPU-only torch (no GPU on this host); everything else from PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: slow tests (overfit-one-window etc.)"]

[tool.ruff]
line-length = 100
target-version = "py312"
